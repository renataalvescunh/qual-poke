<body>
    <div class="bg-ball b1"></div>
    <div class="bg-ball b2"></div>
    <div class="wrap">
        <div class="eyebrow" id="date-label">— carregando data —</div>
        <h1 class="title">Quem é esse Pokémon?</h1>
        <div class="dex">
            <div class="dex-header">
                <div class="lens"></div>
                <div class="dex-dots"><span></span><span></span><span></span></div>
                <div class="label">POKÉDEX<br>DESAFIO Nº <span id="dex-num">???</span></div>
            </div>

            <div class="screen-bezel">
                <div class="screen" id="screen">
                    <div class="silhouette-holder" id="silhouette-holder">
                        <div class="loading-txt" id="loading-txt">AGUARDE,ESTAMOS CARREGANDO OS DADOS DO<br>POKÉMON...</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <p> Escolha apenas 2 das dicas abaixo</p>
                <div class="hint-row" id="hint-row">
                    <button class="hint-btn" data-hint="color" disabled>
                        <span class="hint-label">Dica</span>
                        <span class="hint-value">Codinome</span>
                    </button>
                    <button class="hint-btn" data-hint="generation" disabled>
                        <span class="hint-label">Dica</span>
                        <span class="hint-value">Geração</span>
                    </button>
                    <button class="hint-btn" data-hint="type" disabled>
                        <span class="hint-label">Dica</span>
                        <span class="hint-value">Tipo</span>
                    </button>
            <button class="des-btn" id="des-btn" disabled>
                <span class="hint-label">Revelar</span>
            </button>
                </div>

            <div class="guess-row">
                <input type="text" id="guess-input" placeholder="Digite aqui..." list="pokemon-list" disabled autocomplete="off"
                    autocapitalize="off" spellcheck="false">
                <datalist id="pokemon-list"></datalist>
                <button id="guess-btn" disabled>Já sei!</button>
            </div>

                <div class="tries-label" id="tries-label">Tentativas: 0 </div>
                <div class="chips-wrap" id="chips-wrap"></div>
            </div>
        </div>
        <footer> Dados via <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer"> PokéAPI </a> · Um Pokémon novo aparece todo dia à meia-noite, aventure-se!
            <br> ⭐ Por 
            <a href="https://github.com/renataalvescunh" target="_blank" rel="noopener noreferrer"> Renata </a> ⭐ </footer>
    </div>
</body>

</html>
